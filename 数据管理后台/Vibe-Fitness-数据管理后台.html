    function showExerciseEditor(exerciseId) {
      const existing = exerciseId ? state.exerciseLibrary.find(item => item.id === exerciseId) : null;
      const draft = existing || { id: uid('exercise'), name: '', muscleGroup: '腿', category: 'strength', useLeftRight: false, sets: [], gifUrl: '' };
      openModal(existing ? '修改动作' : '新增动作', `<div class="form-grid"><div class="form-group"><label class="form-label">动作名称</label><input class="field" id="exerciseName" value="${escapeHtml(draft.name)}" /></div><div class="form-group"><label class="form-label">训练部位</label><select class="select" id="exerciseMuscle">${['腿','背','胸','肩','臂','核心','有氧'].map(group => `<option ${draft.muscleGroup === group ? 'selected' : ''}>${group}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">动作类型</label><select class="select" id="exerciseCategory"><option value="strength" ${draft.category === 'strength' ? 'selected' : ''}>力量训练</option><option value="cardio" ${draft.category === 'cardio' ? 'selected' : ''}>有氧运动（只记录时间）</option></select></div><div class="form-group"><label class="form-label">记录方式</label><select class="select" id="exerciseMode"><option value="normal">普通重量</option><option value="left-right" ${draft.useLeftRight ? 'selected' : ''}>左右重量分别记录</option><option value="assisted-bodyweight" ${draft.volumeMode === 'assisted-bodyweight' ? 'selected' : ''}>体重减辅助重量</option></select></div><div class="form-group full"><label class="form-label">图片路径</label><input class="field" id="exerciseGif" value="${escapeHtml(draft.gifUrl || '')}" placeholder="images/exercises/example.png" /><div class="form-hint">动作图片仍放在 App 项目内；后台只保存相对路径。</div></div></div>`, {
        onOpen() { if (existing) deleteButton('动作', () => { state.exerciseLibrary = state.exerciseLibrary.filter(item => item.id !== existing.id); }); },
        onSave() {
          const name = document.getElementById('exerciseName').value.trim();
          const category = document.getElementById('exerciseCategory').value;
          const mode = document.getElementById('exerciseMode').value;
          if (!name) return toast('请填写动作名称');
          const result = { ...draft, name, muscleGroup: document.getElementById('exerciseMuscle').value, category, gifUrl: document.getElementById('exerciseGif').value.trim(), sets: [], useLeftRight: category === 'strength' && mode === 'left-right' };
          if (category === 'strength' && mode === 'assisted-bodyweight') result.volumeMode = 'assisted-bodyweight'; else delete result.volumeMode;
          const index = state.exerciseLibrary.findIndex(item => item.id === result.id);
          if (index >= 0) state.exerciseLibrary[index] = result; else state.exerciseLibrary.push(result);
          closeModal(); render(); toast('动作已保存');
        }
      });
    }

    function showTemplateEditor(templateId) {
      const existing = templateId ? state.workoutTemplates.find(item => item.id === templateId) : null;
      const draft = existing || { id: uid('template'), name: '', exerciseIds: [], createdAt: Date.now() };
      const selectedIds = [...new Set(draft.exerciseIds)].filter(id => state.exerciseLibrary.some(exercise => exercise.id === id));
      openModal(existing ? '修改训练模板' : '新增训练模板', `<div class="form-grid"><div class="form-group full"><label class="form-label">模板名称</label><input class="field" id="templateName" value="${escapeHtml(draft.name)}" /></div><div class="form-group full"><label class="form-label">添加动作</label><div style="display:grid;grid-template-columns:1fr 110px;gap:8px"><select class="select" id="templateExerciseSelect"><option value="">选择动作</option>${state.exerciseLibrary.map(exercise => `<option value="${escapeHtml(exercise.id)}">${escapeHtml(exercise.name)} · ${escapeHtml(exercise.muscleGroup)}</option>`).join('')}</select><button class="btn soft" id="addTemplateExercise" type="button">＋ 添加</button></div></div><div class="form-group full"><label class="form-label">训练动作与顺序</label><div class="form-hint">手机套用模板时严格按这里的顺序排列；用上下箭头调整。</div><div class="order-list" id="templateOrderList"></div></div></div>`, {
        large: true,
        onOpen() {
          const list = document.getElementById('templateOrderList');
          const renderOrder = () => {
            list.innerHTML = selectedIds.length ? selectedIds.map((id, index) => {
              const exercise = state.exerciseLibrary.find(item => item.id === id);
              return `<div class="order-row" data-template-order-id="${escapeHtml(id)}"><span class="order-number">${index + 1}</span><div><strong style="font-size:13px">${escapeHtml(exercise?.name || id)}</strong><div class="cell-sub">${escapeHtml(exercise?.muscleGroup || '未分类')}</div></div><div class="action-row"><button class="btn icon small template-up" type="button" ${index === 0 ? 'disabled' : ''}>↑</button><button class="btn icon small template-down" type="button" ${index === selectedIds.length - 1 ? 'disabled' : ''}>↓</button><button class="btn icon small danger template-remove" type="button">×</button></div></div>`;
            }).join('') : '<div class="empty" style="padding:25px">还没有动作，请从上方添加。</div>';
          };
          renderOrder();
          document.getElementById('addTemplateExercise').onclick = () => {
            const id = document.getElementById('templateExerciseSelect').value;
            if (!id) return toast('请先选择一个动作');
            if (selectedIds.includes(id)) return toast('这个动作已经在模板中');
            selectedIds.push(id);
            renderOrder();
          };
          list.onclick = event => {
            const row = event.target.closest('[data-template-order-id]');
            if (!row) return;
            const index = selectedIds.indexOf(row.dataset.templateOrderId);
            if (event.target.closest('.template-up') && index > 0) {
              [selectedIds[index - 1], selectedIds[index]] = [selectedIds[index], selectedIds[index - 1]];
              renderOrder();
            } else if (event.target.closest('.template-down') && index < selectedIds.length - 1) {
              [selectedIds[index + 1], selectedIds[index]] = [selectedIds[index], selectedIds[index + 1]];
              renderOrder();
            } else if (event.target.closest('.template-remove')) {
              selectedIds.splice(index, 1);
              renderOrder();
            }
          };
          if (existing) deleteButton('模板', () => { state.workoutTemplates = state.workoutTemplates.filter(item => item.id !== existing.id); });
        },
        onSave() {
          const name = document.getElementById('templateName').value.trim();
          if (!name) return toast('请填写模板名称');
          if (!selectedIds.length) return toast('请至少添加一个动作');
          const result = { ...draft, name, exerciseIds: [...selectedIds] };
          const index = state.workoutTemplates.findIndex(item => item.id === result.id);
          if (index >= 0) state.workoutTemplates[index] = result; else state.workoutTemplates.push(result);
          closeModal(); render(); toast('模板已保存');
        }
      });
    }

    function showNoteEditor(noteId) {
      const existing = noteId ? state.notes.find(item => item.id === noteId) : null;
      const draft = existing || { id: uid('note'), title: '', content: '', folderId: state.folders[0]?.id || null, createdAt: Date.now(), updatedAt: Date.now() };
      openModal(existing ? '修改知识笔记' : '新增知识笔记', `<div class="form-grid"><div class="form-group"><label class="form-label">标题</label><input class="field" id="noteTitle" value="${escapeHtml(draft.title)}" /></div><div class="form-group"><label class="form-label">文件夹</label><select class="select" id="noteFolder"><option value="">未分类</option>${state.folders.map(folder => `<option value="${escapeHtml(folder.id)}" ${draft.folderId === folder.id ? 'selected' : ''}>${escapeHtml(folder.name)}</option>`).join('')}</select></div><div class="form-group full"><label class="form-label">正文（支持 Markdown 和双链）</label><textarea class="textarea" id="noteContent" style="min-height:260px" placeholder="输入 [[另一篇笔记标题]] 创建双链">${escapeHtml(draft.content)}</textarea><div class="form-hint">双链格式：[[笔记标题]]。引用和反向引用会自动整理在下方。</div></div><div class="form-group full"><label class="form-label">双链关系</label><div id="noteRelations"></div></div></div>`, {
        large: true,
        onOpen() {
          const relations = document.getElementById('noteRelations');
          const renderRelations = () => {
            const currentTitle = document.getElementById('noteTitle').value.trim();
            const outgoing = wikiLinks(document.getElementById('noteContent').value);
            const incoming = currentTitle ? state.notes.filter(note => note.id !== draft.id && wikiLinks(note.content).some(link => link.toLocaleLowerCase() === currentTitle.toLocaleLowerCase())) : [];
            relations.innerHTML = `<div class="check-row" style="display:block;padding:12px 14px"><span style="display:block;margin-bottom:7px">这篇笔记引用了</span>${outgoing.length ? outgoing.map(title => `<button type="button" class="tag" data-open-linked-note="${escapeHtml(title)}">[[${escapeHtml(title)}]]</button>`).join('') : '<span class="tag gray">暂无</span>'}</div><div class="check-row" style="display:block;padding:12px 14px;margin-top:8px"><span style="display:block;margin-bottom:7px">哪些笔记引用了这篇</span>${incoming.length ? incoming.map(note => `<button type="button" class="tag orange" data-open-linked-note="${escapeHtml(note.title)}">${escapeHtml(note.title)}</button>`).join('') : '<span class="tag gray">暂无反向引用</span>'}</div>`;
          };
          renderRelations();
          document.getElementById('noteTitle').addEventListener('input', renderRelations);
          document.getElementById('noteContent').addEventListener('input', renderRelations);
          relations.onclick = event => {
            const title = event.target.closest('[data-open-linked-note]')?.dataset.openLinkedNote;
            if (!title) return;
            const linked = state.notes.find(note => note.title.trim().toLocaleLowerCase() === title.trim().toLocaleLowerCase());
            if (!linked) return toast(`还没有找到“${title}”`);
            closeModal();
            showNoteEditor(linked.id);
          };
          if (existing) deleteButton('笔记', () => { state.notes = state.notes.filter(item => item.id !== existing.id); });
        },
        onSave() {
          const title = document.getElementById('noteTitle').value.trim();
          if (!title) return toast('请填写笔记标题');
          const result = { ...draft, title, folderId: document.getElementById('noteFolder').value || null, content: document.getElementById('noteContent').value, updatedAt: Date.now() };
          const index = state.notes.findIndex(item => item.id === result.id);
          if (index >= 0) state.notes[index] = result; else state.notes.push(result);
          closeModal(); render(); toast('笔记已保存');
        }
      });
    }

    function showFolderEditor(folderId) {
      const existing = folderId ? state.folders.find(item => item.id === folderId) : null;
      const draft = existing || { id: uid('folder'), name: '', icon: 'fa-folder', color: 'green', expanded: true };
      openModal(existing ? '设置文件夹' : '新建文件夹', `<div class="form-grid"><div class="form-group full"><label class="form-label">文件夹名称</label><input class="field" id="folderName" value="${escapeHtml(draft.name)}" placeholder="例如：力量训练" /></div><div class="form-group"><label class="form-label">颜色</label><select class="select" id="folderColor"><option value="green" ${draft.color === 'green' || draft.color === '#10B981' ? 'selected' : ''}>绿色</option><option value="amber" ${draft.color === 'amber' ? 'selected' : ''}>橙色</option><option value="blue" ${draft.color === 'blue' ? 'selected' : ''}>蓝色</option><option value="purple" ${draft.color === 'purple' ? 'selected' : ''}>紫色</option><option value="pink" ${draft.color === 'pink' ? 'selected' : ''}>粉色</option></select></div><div class="form-group"><label class="form-label">图标</label><select class="select" id="folderIcon"><option value="fa-folder">文件夹</option><option value="fa-book" ${draft.icon === 'fa-book' ? 'selected' : ''}>书本</option><option value="fa-star" ${draft.icon === 'fa-star' ? 'selected' : ''}>收藏</option><option value="fa-lightbulb" ${draft.icon === 'fa-lightbulb' ? 'selected' : ''}>灵感</option></select></div></div>`, {
        onOpen() {
          if (existing) deleteButton('文件夹及其中笔记', () => {
            state.folders = state.folders.filter(item => item.id !== existing.id);
            state.notes = state.notes.filter(note => note.folderId !== existing.id);
          });
        },
        onSave() {
          const name = document.getElementById('folderName').value.trim();
          if (!name) return toast('请填写文件夹名称');
          const result = { ...draft, name, color: document.getElementById('folderColor').value, icon: document.getElementById('folderIcon').value, expanded: true };
          const index = state.folders.findIndex(item => item.id === result.id);
          if (index >= 0) state.folders[index] = result; else state.folders.push(result);
          closeModal(); render(); toast('文件夹已保存');
        }
      });
    }

    function toast(message) {
      const element = document.getElementById('toast');
      element.textContent = message;
      element.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => element.classList.remove('show'), 2400);
    }

    function exportBackup() {
      const clean = normalizeBackup(state);
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `vibe-fitness-backup-${today()}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      toast(`备份已生成：${humanSize(blob.size)}`);
    }

    async function importBackup(file) {
      if (!file) return;
      try {
        const text = await file.text();
        state = normalizeBackup(JSON.parse(text));
        currentView = 'workouts';
        render();
        toast(`已导入 ${file.name}`);
      } catch (error) {
        alert(`导入失败：${error.message}`);
      } finally {
        fileInput.value = '';
      }
    }

    document.addEventListener('click', event => {
      const view = event.target.closest('[data-view]')?.dataset.view;
      if (view) { currentView = view; render(); return; }
      const globalAction = event.target.closest('[data-global-action]')?.dataset.globalAction;
      if (globalAction === 'import') { fileInput.click(); return; }
      if (globalAction === 'export') { exportBackup(); return; }
      if (globalAction === 'reset-local') {
        if (!confirm('确定清除当前浏览器中的本机草稿吗？请确认已经导出需要保留的数据。')) return;
        localStorage.removeItem(LOCAL_DRAFT_KEY);
        state = createEmptyData();
        currentView = 'workouts';
        render();
        toast('本机草稿已清除');
        return;
      }
      const add = event.target.closest('[data-add]')?.dataset.add;
      if (add === 'workout') return showWorkoutEditor();
      if (add === 'metric') return showMetricEditor(undefined, activeMetricTab);
      if (add === 'photo') return showPhotoAdd();
      if (add === 'exercise') return showExerciseEditor();
      if (add === 'template') return showTemplateEditor();
      if (add === 'note') return showNoteEditor();
      if (add === 'folder') return showFolderEditor();
      const workoutId = event.target.closest('[data-edit-workout]')?.dataset.editWorkout;
      if (workoutId) return showWorkoutEditor(workoutId);
      const workoutDate = event.target.closest('[data-add-workout-date]')?.dataset.addWorkoutDate;
      if (workoutDate) return showWorkoutEditor(undefined, workoutDate);
      const metricId = event.target.closest('[data-edit-metric]')?.dataset.editMetric;
      if (metricId) return showMetricEditor(metricId);
      const photoId = event.target.closest('[data-edit-photo]')?.dataset.editPhoto;
      if (photoId) return showPhotoEditor(photoId);
      const exerciseId = event.target.closest('[data-edit-exercise]')?.dataset.editExercise;
      if (exerciseId) return showExerciseEditor(exerciseId);
      const templateId = event.target.closest('[data-edit-template]')?.dataset.editTemplate;
      if (templateId) return showTemplateEditor(templateId);
      const noteId = event.target.closest('[data-edit-note]')?.dataset.editNote;
      if (noteId) return showNoteEditor(noteId);
      const folderId = event.target.closest('[data-edit-folder]')?.dataset.editFolder;
      if (folderId) return showFolderEditor(folderId);
      const workoutMode = event.target.closest('[data-workout-mode]')?.dataset.workoutMode;
      if (workoutMode) { workoutViewMode = workoutMode; render(); return; }
      const monthDirection = Number(event.target.closest('[data-month-direction]')?.dataset.monthDirection || 0);
      if (monthDirection) {
        workoutCalendarMonth = new Date(workoutCalendarMonth.getFullYear(), workoutCalendarMonth.getMonth() + monthDirection, 1);
        render();
        return;
      }
      const metricTab = event.target.closest('[data-metric-tab]')?.dataset.metricTab;
      if (metricTab) { activeMetricTab = metricTab; render(); return; }
      if (event.target.closest('[data-modal-close]')) closeModal();
    });

    content.addEventListener('input', event => {
      if (event.target.id === 'workoutSearch') {
        const query = event.target.value.trim().toLowerCase();
        document.querySelectorAll('#workoutRows tr').forEach(row => { row.style.display = row.dataset.search.toLowerCase().includes(query) ? '' : 'none'; });
      }
      if (event.target.id === 'exerciseSearch') {
        const query = event.target.value.trim().toLowerCase();
        document.querySelectorAll('#exerciseGrid .exercise-card').forEach(card => { card.style.display = card.dataset.search.toLowerCase().includes(query) ? '' : 'none'; });
      }
    });

    content.addEventListener('click', event => {
      const filter = event.target.closest('[data-filter]');
      if (!filter) return;
      document.querySelectorAll('#exerciseFilter .segment').forEach(button => button.classList.remove('active'));
      filter.classList.add('active');
      document.querySelectorAll('#exerciseGrid .exercise-card').forEach(card => { card.style.display = filter.dataset.filter === 'all' || card.dataset.exerciseCategory === filter.dataset.filter ? '' : 'none'; });
    });

    fileInput.addEventListener('change', () => importBackup(fileInput.files[0]));

    photoInput.addEventListener('change', async () => {
      const files = [...photoInput.files];
      if (!files.length) return;
      const results = await Promise.all(files.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ id: uid('photo'), uri: reader.result, date: photoDatePending, timestamp: new Date(`${photoDatePending}T12:00:00`).getTime() });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      })));
      state.bodyPhotos.push(...results);
      photoInput.value = '';
      currentView = 'photos';
      render();
      toast(`已添加 ${results.length} 张照片`);
    });

    modalBackdrop.addEventListener('click', event => { if (event.target === modalBackdrop) closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });

    document.addEventListener('dragover', event => {
      const zone = document.getElementById('dropZone');
      if (!zone) return;
      event.preventDefault(); zone.classList.add('drag');
    });
    document.addEventListener('dragleave', event => { document.getElementById('dropZone')?.classList.remove('drag'); });
    document.addEventListener('drop', event => {
      const zone = document.getElementById('dropZone');
      if (!zone) return;
      event.preventDefault(); zone.classList.remove('drag');
      importBackup(event.dataTransfer.files[0]);
    });

    render();
  </script>
</body>
</html>
