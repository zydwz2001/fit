name: Build Android APK

on:
  push:
    branches: [agent/android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check web application
        run: npm run check

      - name: Sync Android application
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          build_tools_version=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$build_tools_version/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Vibe-Fitness-Android-Preview.apk
          sha256sum Vibe-Fitness-Android-Preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Fitness-Android-Preview
          path: Vibe-Fitness-Android-Preview.apk
          if-no-files-found: error
          retention-days: 14
