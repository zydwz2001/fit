name: Build Android APK

on:
  push:
    branches: [main, agent/android-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check web application
        run: npm run check

      - name: Sync Android application
        run: npm run android:sync

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/vibe-fitness-release.p12
          chmod 600 android/app/vibe-fitness-release.p12

      - name: Build signed release APK
        working-directory: android
        env:
          VIBE_FITNESS_KEYSTORE_FILE: ${{ github.workspace }}/android/app/vibe-fitness-release.p12
          VIBE_FITNESS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIBE_FITNESS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIBE_FITNESS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          build_tools_version=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$build_tools_version/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare download
        id: package
        run: |
          version_name=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)
          test -n "$version_name"
          apk_name="Vibe-Fitness-${version_name}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Fitness-${{ steps.package.outputs.version_name }}
          path: ${{ steps.package.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish no-login preview release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_name="${{ steps.package.outputs.version_name }}"
          apk_name="${{ steps.package.outputs.apk_name }}"
          test -n "$version_name"
          tag="v${version_name}"
          release_title="Vibe Fitness ${version_name}"
          release_notes="Vibe Fitness Android 可安装包。下载 APK 后可直接安装。"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_name" --clobber
          else
            gh release create "$tag" "$apk_name" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes"
          fi
